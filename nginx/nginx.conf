user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/hotel_error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Biện pháp Hardening: Ẩn phiên bản Nginx
    server_tokens off;

    # Định dạng Log dạng JSON chuẩn cho Promtail & Loki
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log  /var/log/nginx/hotel_access.log  json_analytics;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip nén dữ liệu tối ưu băng thông
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Rate Limiting: Chống Brute Force và DoS
    limit_req_zone $binary_remote_addr zone=hotel_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=hotel_conn:10m;

    # ==========================================================
    # CẤU HÌNH HTTP (PORT 80) -> TỰ ĐỘNG CHUYỂN HƯỚNG SANG HTTPS (443)
    # ==========================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost hotel.local;

        # Endpoint giám sát Nginx cho Prometheus exporter (nội bộ)
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            # deny all;
        }

        # Chuyển hướng toàn bộ traffic sang HTTPS an toàn
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================
    # CẤU HÌNH HTTPS (PORT 443) VỚI SSL/TLS VÀ SECURITY HEADERS
    # ==========================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost hotel.local;

        # Chứng chỉ SSL/TLS tự ký
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Hardening giao thức SSL/TLS (chỉ dùng TLS 1.2 và 1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ======================================================
        # CÁC SECURITY HEADERS THEO TIÊU CHUẨN OWASP (HARDENING)
        # ======================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:; img-src 'self' data: https:;" always;

        # Áp dụng giới hạn rate limit và connection limit
        limit_req zone=hotel_limit burst=50 nodelay;
        limit_conn hotel_conn 20;

        # 1. Reverse Proxy tới Web Application Đặt phòng
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 2. Reverse Proxy tới Công cụ Quản lý Cơ sở dữ liệu pgAdmin 4
        location /pgadmin/ {
            proxy_pass http://pgadmin:8080/;
            proxy_http_version 1.1;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Endpoint stub_status trên HTTPS
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
        }

        # Tùy biến trang báo lỗi thân thiện
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
